name: Bug report
description: Report a reproducible problem in an example, notebook, or setup.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please remove secrets and private data before submitting.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and the expected behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      description: Include the smallest command or code example that reproduces the issue.
      render: shell
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.13"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and environment
      placeholder: "Linux, repository .venv"
    validations:
      required: true
  - type: textarea
    id: traceback
    attributes:
      label: Full traceback or logs
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I ran `python -m pip check`.
          required: true
        - label: I searched existing issues.
          required: true
