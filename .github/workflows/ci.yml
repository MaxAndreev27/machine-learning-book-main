name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GridWorld runtime dependencies
        run: python -m pip install numpy==2.5.3 pygame==2.6.1

      - name: Compile Python examples
        run: python -m compileall -q gridworld

      - name: Validate project metadata
        run: |
          test -f README.md
          test -f requirements.txt
          test -f LICENSE
          test -f gridworld/agent.py
          test -f gridworld/gridworld_env.py
          test -f gridworld/qlearning.py
          ! grep -Eiq 'cuda|nvidia|triton|pygame-ce' requirements.txt

      - name: Validate GridWorld headlessly
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cd gridworld
          python - <<'PY'
          from gridworld_env import GridWorldEnv

          env = GridWorldEnv()
          state, _ = env.reset(seed=1)
          assert state == 0
          assert (env.num_rows, env.num_cols) == (10, 10)
          assert len(env.terminal_states) == 6
          assert len(set(env.terminal_states)) == 6
          frame = env.render(mode="rgb_array")
          assert frame.shape == (1000, 1000, 3)
          env.close()
          PY
