name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v5

      - name: Install GridWorld runtime dependencies
        run: uv sync --locked

      - name: Compile Python examples
        run: uv run python -m compileall -q gridworld

      - name: Validate project metadata
        run: |
          test -f README.md
          test -f pyproject.toml
          test -f uv.lock
          test -f LICENSE
          test -f gridworld/agent.py
          test -f gridworld/gridworld_env.py
          test -f gridworld/qlearning.py
          ! grep -Eiq 'cuda|nvidia|triton|pygame-ce' pyproject.toml

      - name: Validate GridWorld headlessly
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          cd gridworld
          uv run python - <<'PY'
          from gridworld_env import GridWorldEnv

          env = GridWorldEnv()
          state, _ = env.reset(seed=1)
          assert state == 0
          assert (env.num_rows, env.num_cols) == (8, 8)
          assert env.nS == 64
          assert env.num_traps == 7
          assert len(env.terminal_states) == 8
          assert len(set(env.terminal_states)) == 8
          assert 0 not in env.terminal_states
          frame = env.render(mode="rgb_array")
          assert frame.shape == (800, 800, 3)
          layout = env.terminal_states.copy()
          env.reset()
          assert env.terminal_states == layout
          env.close()
          PY
